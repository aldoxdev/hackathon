databases:
  - name: mi-cuenta-conmigo-db
    plan: free
    databaseName: mi_cuenta_conmigo
    user: mi_cuenta_conmigo

services:
  - type: web
    name: mi-cuenta-conmigo-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mi-cuenta-conmigo-db
          property: connectionString
      - key: CORS_ORIGINS
        value: http://localhost:3000,https://mis-cuentas-conmigo.onrender.com
      # Sin valor aqui a proposito (nunca se debe commitear una llave real) — Render la pide
      # en su propio dashboard al desplegar. Sin esto, el chatbot responde 503 en produccion.
      - key: OPENAI_API_KEY
        sync: false
      # Fijo a la version usada en desarrollo local (3.12). Sin esto, Render usa por defecto
      # la version de Python mas reciente (3.14 al momento de escribir esto), que rompe con
      # un error de "typing.Union" en SQLAlchemy 2.0.36 al leer anotaciones tipo "date | None".
      - key: PYTHON_VERSION
        value: 3.12.10

  - type: web
    name: mis-cuentas-conmigo
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./out
    envVars:
      # Se usa en tiempo de build (Next.js "output: export" lo incluye directo en el HTML/JS
      # generado, no se lee en tiempo de ejecucion). Debe apuntar al backend de arriba.
      - key: NEXT_PUBLIC_API_URL
        value: https://mi-cuenta-conmigo-backend.onrender.com
